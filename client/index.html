<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F4C5C" />
        <script>
      (function () {
        try {
          var saved = localStorage.getItem('ripple_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B1A20' : '#0F4C5C');
        } catch (e) {}
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Ripple — Hydration Tracker</title>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <clipPath id="dropClip" clipPathUnits="objectBoundingBox">
          <path d="M0.5,0 C0.5,0 0.92,0.55 0.92,0.72 C0.92,0.90 0.73,1 0.5,1 C0.27,1 0.08,0.90 0.08,0.72 C0.08,0.55 0.5,0 0.5,0 Z" />
        </clipPath>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
